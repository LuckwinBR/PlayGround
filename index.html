function unlockedJutsus(){return(jutsusByAffinity[state?.chakraAffinity]||[]).filter(jutsu=>(Number(state?.intel)||0)>=jutsu.intel)}
function syncJutsuUnlocks(){state.jutsuKnown??=[];const fresh=unlockedJutsus().filter(jutsu=>!state.jutsuKnown.includes(jutsu.id));state.jutsuKnown=[...new Set([...state.jutsuKnown,...unlockedJutsus().map(jutsu=>jutsu.id)])];return fresh}
function renderJutsuPanel(){const unlocked=unlockedJutsus();const next=(jutsusByAffinity[state.chakraAffinity]||[]).find(jutsu=>state.intel<jutsu.intel);return `<div class="jutsu-panel"><div class="jutsu-heading"><strong>Afinidade: ${escapeHtml(state.chakraAffinity||'desconhecida')}</strong><span>baseada na linhagem ou no acaso</span></div><div class="jutsu-list">${unlocked.length?unlocked.map(jutsu=>`<span class="jutsu-chip">${escapeHtml(jutsu.name)}</span>`).join(''):'<span class="tiny">Estude para despertar seu primeiro jutsu.</span>'}</div>${next?`<div class="jutsu-next">Próximo: ${escapeHtml(next.name)} · inteligência ${next.intel}</div>`:'<div class="jutsu-next">Todos os jutsus desta afinidade foram despertados.</div>'}</div>`}
function syncCharacters(){const known=new Set(characterTimeline.map(character=>character.name));const active=new Set(availableCharacters(state.worldYear).map(character=>character.name));state.relations=(state.relations||[]).filter(r=>!known.has(r.name)||active.has(r.name));const present=new Set(state.relations.map(r=>r.name));for(const character of availableCharacters(state.worldYear))if(!present.has(character.name))state.relations.push(character);state.interactionTarget=-1}
function eraLabel(year=state?.worldYear??66){return eras[timelineEra(year)].label}
function makeSetup(){const saved=localStorage.getItem('shinobi-save');const savedState=saved?JSON.parse(saved):null;$('#setup').innerHTML=`<div class="eyebrow">Seu destino começa agora</div><h1>Que tipo de shinobi<br>você vai se tornar?</h1><p class="setup-copy">Uma vida inteira no mundo ninja. Escolha sua era e origem, faça amigos, treine e decida o que vale a pena proteger. Cada decisão deixa uma marca.</p><div class="form-grid"><div class="field"><label for="name">Nome</label><input id="name" maxlength="20" placeholder="Ex.: Ren" value="${savedState?escapeHtml(savedState.name):''}"></div><div class="field"><label for="era">Era de início</label><select id="era">${Object.entries(eras).map(([key,era])=>`<option value="${key}" ${savedState?(savedState.era||'naruto')===key?'selected':'':key==='naruto'?'selected':''}>${era.label}</option>`).join('')}</select></div><div class="field"><label for="clan">Clã / origem</label><select id="clan">${clans.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label for="village">Vila natal</label><select id="village">${villages.map(v=>`<option>${v}</option>`).join('')}</select></div></div><p class="tiny">A era define o calendário e os eventos históricos. Sua jornada começa aos 6 anos.</p><div class="start-row">${saved?'<button class="primary" id="resume">Continuar jornada&nbsp; →</button>':''}<button class="${saved?'secondary':'primary'}" id="start">${saved?'Nova vida':'Começar minha história'}&nbsp; →</button>${saved?'<span class="tiny">Salvamento automático</span>':''}</div>${saved?'<div style="margin-top:16px;color:#64806b;font-size:12px">Sua jornada está salva neste dispositivo.</div>':''}`;
$('#start').onclick=()=>startGame();const resume=$('#resume');if(resume)resume.onclick=()=>{try{state=JSON.parse(localStorage.getItem('shinobi-save'));state.era??='naruto';state.worldYear??=66+(state.age-6);state.health??=100;state.chakraPoints??=40;state.rogue??=false;state.canonSeen??=[];state.combat??=null;state.relations??=[];state.children??=[];state.lineage??=[];state.journal??=[];state.activities??=0;state.chakraAffinity??=randomAffinity(state.clan);state.jutsuKnown??=unlockedJutsus().map(jutsu=>jutsu.id);syncJutsuUnlocks();state.event??=nextEvent();syncCharacters();save();render()}catch{toast('Não foi possível carregar a jornada salva.')}}; }
function startGame(){let name=$('#name').value.trim()||'Akira';const era=$('#era').value;state={name,era,clan:$('#clan').value,village:$('#village').value,age:6,worldYear:eras[era].startYear,phase:'Estudante',chakra:25,chakraPoints:40,health:100,taijutsu:20,ninjutsu:18,intel:25,bond:20,renown:0,ryo:80,energy:85,activities:0,alive:true,finished:false,rogue:false,canonSeen:[],combat:null,year:0,relations:availableCharacters(eras[era].startYear),children:[],lineage:[],journal:[],eventIndex:0,visited:[]};if(state.clan==='Uchiha')state.ninjutsu+=8;if(state.clan==='Hyūga')state.taijutsu+=8;if(state.clan==='Uzumaki')state.chakra+=10;if(state.clan==='Nara')state.intel+=8;state.chakraAffinity=randomAffinity(state.clan);state.jutsuKnown=[];syncJutsuUnlocks();state.event=nextEvent();save();render();}

 function progressSummary(before){if(!before)return'';const labels={chakra:'chakra',taijutsu:'taijutsu',ninjutsu:'ninjutsu',intel:'inteligência',bond:'vínculos',renown:'reputação',energy:'energia',ryo:'ryō'};const changes=[];for(const [key,value] of Object.entries(before.stats)){const delta=(Number(state[key])||0)-value;if(delta)changes.push(`${delta>0?'+':''}${delta} ${labels[key]}`)}const relationships=[];for(const person of state.relations||[]){const delta=(Number(person.value)||0)-(before.relations[person.name]||0);if(delta)relationships.push(`${person.name} ${delta>0?'+':''}${delta}`)}if(relationships.length)changes.push(`laços: ${relationships.join(', ')}`);return changes.length?` Variações: ${changes.join(' · ')}.`:''}

function canonEvent(){if(state.canonSeen.includes(state.worldYear))return null;const year=state.worldYear;if(timelineEra()==='hagoromo'){const moments={[-998]:{title:'O legado do Sábio dos Seis Caminhos',text:'As histórias sobre Hagoromo Ōtsutsuki inspiram os primeiros caminhos de chakra. Mestres discutem como usar esse poder para unir, e não dividir.',choices:[{label:'Estudar os ensinamentos antigos',effect:'+4 intel,+3 chakra'},{label:'Treinar para proteger sua comunidade',effect:'+4 taijutsu,+3 bond'},{label:'Compartilhar o que aprendeu',effect:'+4 bond,+2 renown'}]},[-996]:{title:'A origem dos caminhos ninja',text:'Novas formas de compreender o chakra começam a se espalhar. Seu clã precisa decidir como preservar esse conhecimento.',choices:[{label:'Registrar as técnicas para o futuro',effect:'+4 intel,+2 renown'},{label:'Praticar o controle de chakra',effect:'+5 chakra,+2 ninjutsu'},{label:'Ensinar um jovem aprendiz',effect:'+4 bond,+2 renown'}]},[-994]:{title:'Uma era de clãs',text:'Clãs distantes disputam território e influência. Uma decisão sua pode aproximar pessoas ou prolongar antigas rivalidades.',choices:[{label:'Propor uma trégua',effect:'+5 bond,+3 renown'},{label:'Preparar a defesa do clã',effect:'+4 taijutsu,+2 intel'},{label:'Buscar uma rota segura para todos',effect:'+4 intel,+3 bond'}]}};const moment=moments[year];return moment?{...moment,canonYear:year}:null;}if(timelineEra()==='hashirama'){const moments={2:{title:'A guerra entre clãs',text:'Senju e Uchiha vivem tempos de conflito. Sua geração cresce entre missões perigosas e a esperança de um futuro diferente.',choices:[{label:'Proteger os companheiros',effect:'+4 bond,+3 taijutsu'},{label:'Estudar os movimentos do rival',effect:'+4 intel,+2 ninjutsu'},{label:'Buscar uma conversa entre os clãs',effect:'+4 bond,+2 renown'}]},4:{title:'O pacto de paz',text:'Hashirama Senju e Madara Uchiha tentam transformar uma longa rivalidade em aliança. Muitos ainda desconfiam que a paz possa durar.',choices:[{ t:'+3 taijutsu,+3 bond'}]},72:{title:'A partida de Sasuke',text:'Sasuke deixa a vila em busca de poder. Amigos e líderes discutem como trazê-lo de volta sem esquecer os riscos.',choices:[{label:'Apoiar a equipe de resgate',effect:'+3 taijutsu,+3 bond'},{label:'Ajudar a planejar a busca',effect:'+4 intel,+2 renown'},{label:'Respeitar a escolha dele, mesmo discordando',effect:'+4 bond,+2 intel'}]},76:{title:'O ataque de Pain',text:'A Folha é atingida por uma força devastadora. A prioridade é salvar vidas e ajudar a vila a se reerguer.',choices:[{label:'Resgatar moradores',effect:'+5 bond,+3 renown,-8 energy'},{label:'Levar suprimentos aos feridos',effect:'+4 renown,+2 intel'},{label:'Defender um ponto de evacuação',effect:'+3 taijutsu,+3 renown,-8 energy'}]},78:{title:'A Quarta Guerra Shinobi',text:'As grandes vilas se unem diante de uma ameaça comum. Sua experiência pode fazer diferença na proteção da aliança.',choices:[{label:'Lutar ao lado da aliança',effect:'+4 taijutsu,+4 renown,-10 energy'},{label:'Coordenar informações e estratégia',effect:'+5 intel,+3 renown'},{label:'Proteger aliados e civis',effect:'+5 bond,+3 renown'}]}};const moment=moments[year];return moment?{...moment,canonYear:year}:null;}function nextEvent(){const canon=canonEvent();if(canon)return canon;const pool=eventPool();let idx=Math.floor(Math.random()*pool.length);if(pool.length>1&&idx===state.eventIndex)idx=(idx+1)%pool.length;state.eventIndex=idx;const e=pool[idx];return{title:e[0],text:e[1],choices:e.slice(2).map(s=>{const [label,effect]=s.split('|');return{label,effect}})};}

];
function startCombat(){const names=state.rogue?['Caçador de recompensas','Ninja rastreador','Mercenário da fronteira']:['Rival da Academia','Ninja renegado','Desafiante da vila'];const name=names[Math.floor(Math.random()*names.length)];const max=48+Math.min(38,Math.floor(state.age*.65));state.combat={name,health:max,maxHealth:max,power:9+Math.floor(state.age/5),guard:false};state.energy-=8;return`Você iniciou um duelo contra ${name}. ${clanTraits[state.clan].name}: ${clanTraits[state.clan].description}`;}
function combatTurn(move,jutsuId){const b=state.combat;if(!b)return;const trait=clanTraits[state.clan]||{};const available=unlockedJutsus();const jutsu=available.find(item=>item.id===jutsuId)||available[0];let text='';if(move==='fugir'){state.health=Math.max(1,state.health-3);state.combat=null;text='Você encerrou o duelo e recuou. -3 vitalidade.';}else{if(move==='atacar'){const damage=9+Math.floor(state.taijutsu*.24)+Math.floor(Math.random()*7)+(trait.attackBonus||0);b.health=Math.max(0,b.health-damage);text=`Seu ataque acerta e causa ${damage} de dano${trait.attackBonus?' com a vantagem de '+trait.name:''}.`;}else if(move==='jutsu'){if(!jutsu){toast('Estude e aumente sua inteligência para desbloquear jutsus.');return}const cost=Math.max(5,(trait.chakraCost||12)+jutsu.cost-14);if(state.chakraPoints<cost){toast(`Você precisa de ${cost} pontos de chakra para usar ${jutsu.name}.`);return}state.chakraPoints-=cost;const damage=Math.floor((12+Math.floor(state.ninjutsu*.3)+Math.floor(Math.random()*9))*jutsu.multiplier)+(trait.jutsuBonus||0);b.health=Math.max(0,b.health-damage);text=`${jutsu.name} acerta e causa ${damage} de dano. -${cost} chakra.`;}else{const recovery=trait.chakraRegen||9;state.chakraPoints=clamp(state.chakraPoints+recovery);b.guard=true;text=`Você assume uma postura defensiva e recupera ${recovery} chakra.`;}if(b.health<=0){state.combat=null;state.ryo+=16;state.renown+=3;state.taijutsu+=1;state.energy=clamp(state.energy-4);text+=` Vitória! +16 ryō, +3 reputação e +1 taijutsu.`;}else{let damage=Math.max(3,b.power+Math.floor(Math.random()*7)-Math.floor(state.taijutsu*.09));if(b.guard)damage=Math.ceil(damage*(trait.guardReduction||.35));if(trait.incomingMultiplier)damage=Math.ceil(damage*trait.incomingMultiplier);if(Math.random()< (trait.dodgeChance||0)){damage=0;text+=` O Sharingan prevê o contra-ataque: você esquiva sem sofrer dano.`;}else{state.health=Math.max(0,state.health-damage);text+=` ${b.name} contra-ataca e causa ${damage} de dano${trait.incomingMultiplier?' após sua defesa especial':''}.`;}b.guard=false;if(state.health<=0){state.health=12;state.combat=null;state.energy=clamp(state.energy-12);text+=' Você foi derrotado e recuou com ajuda da equipe. Vitalidade recuperada até 12.';}}}addJournal(text,'Combate');save();render();toast(text);}function setRogue(){if(state.rogue)return;state.rogue=true;state.bond=clamp(state.bond-8);state.renown+=2;addJournal(`Você abandonou ${state.village} e passou a viver como ninja rogue (nukenin).`);save();}function becomeRogue(){if(state.rogue)return;if(confirm(`Abandonar ${state.village} e se tornar um ninja rogue (nukenin)? Essa escolha muda suas missões e sua vida na vila.`)){setRogue();render();toast('Você agora é um nukenin. Sua antiga vila pode enviar perseguidores.');}}function doAction(i){if(state.combat){toast('Conclua o combate atual antes de fazer outra atividade.');return}if(state.finished||state.activities>=2||(state.energy<5&&i!==4)){ toast(state.activities>=2?'Você já aproveitou suas duas atividades deste ano.':'Energia baixa — tente descansar.');return}const before=progressSnapshot();const result=actions[i].run();if(!result){toast('Missões ninja ficam disponíveis a partir dos 12 anos.');return}state.activities++;state.energy=clamp(state.energy);state.ryo=Math.max(0,state.ryo);const freshJutsus=syncJutsuUnlocks();const details=result+progressSummary(before)+(freshJutsus.length?` Novo jutsu desbloqueado: ${freshJutsus.map(jutsu=>jutsu.name).join(', ')}.`:'');addJournal(details,'Atividade');save();render();toast(details)}
function interactWith(index){if(!state.relations[index])return;state.interactionTarget=state.interactionTarget===index?-1:index;render()}
function relationshipAction(index,action){const person=state.relations[index];if(!person)return;if(state.activities>=2){toast('Você já aproveitou suas duas atividades deste ano.');return}if(state.energy<(action==='family'?8:5)){toast('Energia baixa — descanse antes de interagir.');return}const before=progressSnapshot();if(action==='family'){if(state.age<18||person.value<40){toast('É preciso ter 18 anos e um vínculo de pelo menos 40 para formar uma família.');return}const childName=prompt('Qual será o nome do seu filho ou filha?','');if(!childName?.trim())return;state.children??=[];state.children.push({name:childName.trim().slice(0,20),clan:state.clan,village:state.village,birthYear:state.worldYear,parent:state.name,otherParent:person.name,continued:false});person.value=clamp(person.value+5);state.bond=clamp(state.bond+4);state.energy=clamp(state.energy-8);state.activities=(state.activities||0)+1;addJournal(`${person.name} e ${state.name} formaram uma família. ${childName.trim()} nasceu no ano ${state.worldYear}.${progressSummary(before)}`,'Família');state.interactionTarget=-1;save();render();toast(`Sua família cresceu: ${childName.trim()} nasceu!`);return}const training=action==='train';const increase=training?7:10;person.value=clamp(person.value+increase);state.bond=clamp(state.bond+(training?2:4));state.energy=clamp(state.energy-(training?8:4));if(training)state.taijutsu=clamp(state.taijutsu+2);state.activities++;const text=training?`Você treinou com ${person.name}; o vínculo cresceu e seu taijutsu melhorou.`:`Você teve uma conversa especial com ${person.name}; o vínculo entre vocês se fortaleceu.`;const details=text+progressSummary(before);addJournal(details,'Laços');state.interactionTarget=-1;save();render();toast(details)}
function childAge(child){return Math.max(0,state.worldYear-child.birthYear)}
function continueAsChild(index){const child=state.children?.[index];if(!child||child.continued||childAge(child)<16){toast('Seu filho ou filha precisa completar 16 anos para assumir a jornada.');return}state.lineage??=[];state.lineage.push({name:state.name,clan:state.clan,age:state.age,worldYear:state.worldYear,renown:state.renown});const parentName=state.name;child.continued=true;state.name=child.name;state.clan=child.clan||state.clan;state.village=child.village||state.village;state.age=16;state.phase='Chūnin';state.finished=false;state.activities=0;state.health=100;state.energy=85;state.combat=null;state.interactionTarget=-1;state.relations??=[];if(!state.relations.some(r=>r.name===parentName))state.relations.unshift({name:parentName,role:'pai/mãe e legado da família',value:75,face:parentName.slice(0,1)});state.journal??=[];addJournal(`${state.name} assume a jornada da família, levando adiante o legado de ${parentName}.`);state.event=nextEvent();save();render();window.scrollTo(0,0);toast(`${state.name} continua a jornada da família.`)}
function applyEffect(effect){for(const part of effect.split(',')){const m=part.match(/^([+-])(\d+)\s+(\w+)$/);if(!m)continue;const amount=Number(m[2])*(m[1]==='-'?-1:1),key=m[3];if(key==='ryo')state.ryo=Math.max(0,state.ryo+amount);else if(key==='energy')state.energy=clamp(state.energy+amount);else if(key==='bond'){state.bond=clamp(state.bond+amount);if(state.relations.length)state.relations[0].value=clamp(state.relations[0].value+Math.ceil(amount/2))}else state[key]=clamp((state[key]||0)+amount)} }
function choose(i){if(state.combat){toast('Conclua ou encerre o duelo antes de avançar o ano.');return}const c=state.event.choices[i];const before=progressSnapshot();applyEffect(c.effect);if(c.action==='rogue')setRogue();if(state.event.canonYear)state.canonSeen.push(state.event.canonYear);const worldNote=state.event.canonYear?`Acontecimento do mundo Shinobi: ${state.event.title}. ${state.event.text} Sua decisão: ${c.label}.`:`${state.event.title}: ${c.label}.`;const freshJutsus=syncJutsuUnlocks();const unlockNote=freshJutsus.length?` Novo jutsu desbloqueado: ${freshJutsus.map(jutsu=>jutsu.name).join(', ')}.`:'';addJournal(worldNote+progressSummary(before)+unlockNote,state.event.canonYear?'Mundo':'Escolha');state.activities=0;state.age++;state.worldYear++;syncCharacters();if(state.age===13)state.phase='Genin';if(state.age===16)state.phase='Chūnin';if(state.age===20)state.phase='Jōnin';if(state.age===65)state.phase='Ancião';if(state.age>=85){state.finished=true;state.phase='Lenda';}state.energy=clamp(state.energy+8);state.health=clamp(state.health+20);state.chakraPoints=clamp(state.chakraPoints+15);state.event=state.finished?null:nextEvent();save();render();}
function skillLabel(key){return{taijutsu:'taijutsu',ninjutsu:'ninjutsu',chakra:'chakra'}[key]||key}
function stat(label,key,color=''){let value=clamp(state[key]);return `<div class="stat"><div class="stat-label"><span>${label}</span><b>${value}</b></div><div class="bar ${color}"><i style="width:${value}%"></i></div></div>`}
function renderRelations(){return state.relations.map((person,index)=>{const expanded=state.interactionTarget===index;const canStartFamily=state.age>=18&&person.value>=40;return `<div class="rel-card"><button class="rel rel-toggle" onclick="interactWith(${index})" aria-expanded="${expanded}"><span class="rel-face">${escapeHtml(person.face||person.name.slice(0,1))}</span><span class="rel-info"><span class="rel-name">${escapeHtml(person.name)}</span><span class="rel-role">${escapeHtml(person.role||'companheiro de jornada')}</span></span><span class="rel-meter"><i style="width:${clamp(person.value)}%"></i></span><span class="rel-score">${clamp(person.value)}</span></button>${expanded?`<div class="rel-actions"><button onclick="relationshipAction(${index},'talk')" ${state.activities>=2||state.energy<5?'disabled':''}>Conversar</button><button onclick="relationshipAction(${index},'train')" ${state.activities>=2||state.energy<5?'disabled':''}>Treinar juntos</button>${canStartFamily?`<button onclick="relationshipAction(${index},'family')" ${state.activities>=2||state.energy<8?'disabled':''}>Formar família</button>`:''}</div>`:''}</div>`}).join('')}
function renderFamily(){const children=state.children||[];if(!children.length)return '';return `<div class="panel family-panel"><div class="section-head"><h3 class="section-title">Família e legado</h3><span class="counter">${children.length} ${children.length===1?'filho(a)':'filhos'}</span></div><div class="family-list">${children.map((child,index)=>{const age=childAge(child);return `<div class="family-child"><div><strong>${escapeHtml(child.name)}</strong><small>${escapeHtml(child.clan||state.clan)} · ${age} anos${child.continued?' · jornada iniciada':''}</small></div>${!child.continued&&age>=16?`<button class="secondary" onclick="continueAsChild(${index})">Continuar como ${escapeHtml(child.name)} →</button>`:''}</div>`}).join('')}</div><p class="tiny">A jornada da próxima geração mantém o ano do mundo, as memórias e o legado da família.</p></div>`}
function render(){if(!state)return;const combatJutsus=unlockedJutsus();$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');const initials=state.name.slice(0,1).toUpperCase();const stage=state.age<12?'Academia Ninja':state.age<18?'Equipe Genin':state.age<30?'Shinobi de carreira':state.age<60?'Veterano':'Legado ninja';
if(state.finished){const successors=(state.children||[]).map((child,index)=>({child,index})).filter(item=>!item.child.continued&&childAge(item.child)>=16);$('#game').innerHTML=`<div class="panel ending"><div class="eyebrow">Fim de uma jornada extraordinária</div><h2>${escapeHtml(state.name)}, uma vida lembrada</h2><p>Aos ${state.age} anos, você deixa um legado de ${state.renown} pontos de reputação. As histórias de seus feitos continuarão inspirando a próxima geração.</p>${successors.length?`<h3>Continue a história da família</h3>${successors.map(({child,index})=>`<button class="choice" onclick="continueAsChild(${index})">Jogar como ${escapeHtml(child.name)} · ${childAge(child)} anos →</button>`).join('')}`:'<p class="tiny">Nenhum filho chegou aos 16 anos ainda para continuar a jornada.</p>'}<button class="secondary" onclick="newLife()">Começar outra vida</button></div>`;return}
$('#game').innerHTML=`<div class="game-header"><div><div class="eyebrow">${state.village} · ${state.clan}</div><h1 class="game-title">A vida de ${state.name}</h1><p class="subtitle">${stage} · ${state.phase}</p></div><div><div class="year-badge">${escapeHtml(eraLabel())}</div><div class="calendar-line"><span>CALENDÁRIO DO MUNDO NINJA</span><strong>Ano ${state.worldYear} · ${state.age} anos</strong><small>Capítulo ${state.age-5} da sua jornada</small></div></div></div><div class="layout"><div class="left-column"><article class="panel story"><div class="story-top"><span class="story-tag">Capítulo ${state.age-5} · ${state.age} anos</span><span class="tiny">${state.phase}</span></div><h2>${state.event.title}</h2><p>${state.event.text}</p><div class="choices">${state.event.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span>${c.label}</span><span class="arrow">→</span></button>`).join('')}</div><footer>Uma escolha por ano · As consequências moldam sua história</footer></article>
<div class="panel activities"><div class="section-head"><h3 class="section-title">O que você faz este ano?</h3><span class="counter">${state.activities}/2 atividades</span></div><div class="activity-grid">${actions.map((a,i)=>`<button class="activity" onclick="doAction(${i})" ${state.activities>=2||(state.energy<5&&i!==4)?'disabled':''}><span class="icon">${a.icon}</span><strong>${a.title}</strong><small>${a.title==='Fazer missão'&&state.age<12?'Desbloqueia aos 12 anos':a.title==='Fazer missão'&&state.rogue?'Aceite um trabalho clandestino':a.hint}</small></button>`).join('')}</div>${state.combat?`<div class="combat-panel"><div class="combat-top"><span>Duelo: ${escapeHtml(state.combat.name)}</span><span>${state.combat.health} / ${state.combat.maxHealth} PV</span></div><div class="combat-vitals"><span>Oponente</span><div class="combat-bar"><i style="width:${Math.max(0,state.combat.health/state.combat.maxHealth*100)}%"></i></div></div><div class="combat-vitals player"><span>${escapeHtml(state.name)}</span><div class="combat-bar"><i style="width:${state.health}%"></i></div><b>${state.health} PV</b><span>◉ ${state.chakraPoints} chakra</span></div><div class="battle-actions"><button onclick="combatTurn('atacar')">Atacar</button><select id="combat-jutsu" ${combatJutsus.length?'':'disabled'}>${combatJutsus.length?combatJutsus.map(jutsu=>`<option value="${jutsu.id}">${escapeHtml(jutsu.name)} · ${Math.max(5,(clanTraits[state.clan]?.chakraCost||12)+jutsu.cost-14)} chakra</option>`).join(''):'<option>Sem jutsu desbloqueado</option>'}</select><button onclick="combatTurn('jutsu',document.getElementById('combat-jutsu')?.value)" ${!combatJutsus.length||state.chakraPoints<Math.max(5,(clanTraits[state.clan]?.chakraCost||12)+combatJutsus[0].cost-14)?'disabled':''}>Usar técnica selecionada</button><button onclick="combatTurn('defender')">Defender / concentrar</button><button onclick="combatTurn('fugir')">Fugir</button></div></div>`:''}<div class="year-control"><span class="year-note">Sua escolha no capítulo acima encerra o ano e avança a história.</span><span class="counter">♡ energia ${state.energy}%</span></div></div>
<div class="panel journal-panel"><div class="section-head"><h3 class="section-title">Crônica Shinobi</h3><span class="counter">${state.journal.length} registros</span></div><div class="journal-list">${state.journal.length?state.journal.slice(0,10).map(j=>`<div class="journal-item"><time>${j.worldYear??'—'}<small>${j.age}a</small></time><span><b>${escapeHtml(j.kind||'Jornada')}</b>${escapeHtml(j.text)}</span></div>`).join(''):'<div class="tiny">Acontecimentos, escolhas e mudanças nas suas habilidades e relações aparecerão aqui.</div>'}</div></div></div>
<aside class="right-column"><div class="panel stats-panel"><div class="profile"><div class="avatar">${initials}</div><div><div class="profile-name">${state.name}</div><div class="profile-sub">${state.clan} · ${state.phase}</div><div class="tiny">${clanTraits[state.clan]?.name||'Determinação'}: ${clanTraits[state.clan]?.description||''}</div></div></div><div class="stats-grid">${stat('Chakra','chakra','blue')}${stat('Taijutsu','taijutsu','red')}${stat('Ninjutsu','ninjutsu','blue')}${stat('Inteligência','intel')}${stat('Vínculos','bond','green')}${stat('Reputação','renown','green')}</div><div class="power-panel"><div class="power-heading"><strong>Força Shinobi</strong><span class="tiny">estimativa</span></div><div class="power-score">${powerLevel()} <small>pontos de força</small></div><div class="power-references"><div class="power-reference"><strong>Hashirama</strong><span>3.000</span></div><div class="power-reference"><strong>Madara</strong><span>3.000</span></div><div class="power-reference"><strong>Naruto criança</strong><span>700</span></div></div></div>${renderJutsuPanel()}<div class="resources"><div class="resource">Energia<b>${state.energy} / 100</b></div><div class="resource">Ryō<b>¥ ${state.ryo}</b></div><div class="resource">Vitalidade<b>${state.health} / 100</b></div><div class="resource">Chakra de combate<b>${state.chakraPoints} / 100</b></div></div><button class="secondary rogue-button" onclick="becomeRogue()" ${state.rogue?'disabled':''}>${state.rogue?'✓ Ninja rogue · Nukenin':'Abandonar a vila e tornar-se ninja rogue'}</button></div>
<div class="panel rel-panel"><div class="section-head"><h3 class="section-title">Seu círculo</h3><span class="counter">${state.relations.length} personagens em cena</span></div><p class="tiny">Interaja individualmente com quem está presente nesta era.</p><div class="rel-list">${renderRelations()}</div></div>${renderFamily()}<div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px"><span class="tiny">Progresso salvo automaticamente</span><button class="secondary" style="padding:7px 10px;font-size:11px" onclick="confirmRestart()">Nova vida</button></div></aside></div>`;state.year=state.age-6;}
function skipActivities(){toast('Você segue para o próximo capítulo. Escolha um caminho!')}
function newLife(){localStorage.removeItem('shinobi-save');state=null;$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');makeSetup();window.scrollTo(0,0)}
function confirmRestart(){if(confirm('Começar uma nova vida? Seu progresso atual será substituído.'))newLife()}
makeSetup();
</script></body></html>
