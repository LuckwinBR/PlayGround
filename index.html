<style>
:root{--ink:#17202c;--paper:#f3efe5;--muted:#75808b;--line:#e4ddd0;--gold:#c4944e;--red:#c85e4d;--green:#517a67;--night:#101622;--panel:#fffdf8;--shadow:0 12px 36px #17202c12}*{box-sizing:border-box}body{margin:0;background:#eee9df;color:var(--ink);font:15px/1.5 "Avenir Next",Avenir,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{height:68px;background:var(--night);color:#f7f2e8;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1200px)/2),24px);border-bottom:1px solid #ffffff17}.brand{display:flex;gap:12px;align-items:center;font-family:Georgia,serif;letter-spacing:.11em;font-size:14px}.brand-mark{width:32px;height:32px;border:1px solid #c4944e;border-radius:50%;display:grid;place-items:center;color:#e6bc76;font-size:17px}.top-note{color:#a7afba;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.page{max-width:1200px;padding:36px 24px 70px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:#b27643;font-weight:800}.hero-title{font:500 clamp(31px,5vw,47px)/1.08 Georgia,serif;letter-spacing:-.03em;margin:8px 0}.subtitle{color:#737b83;margin:0}.setup{max-width:760px;margin:58px auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:40px 42px;box-shadow:var(--shadow)}.setup h1{font:500 38px/1.12 Georgia,serif;margin:8px 0 12px}.setup-copy{max-width:550px;color:#727a80;margin-bottom:28px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#68717a;font-weight:800;margin:0 0 7px}.field input,.field select{width:100%;border:1px solid #dcd5c9;background:#fffefa;padding:12px 13px;border-radius:4px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c4944e1b}.form-wide{grid-column:1/-1}.primary{border:0;background:var(--red);color:white;p head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-title{font:500 20px Georgia,serif;margin:0}.counter{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#848b8e}.activity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.activity{background:#faf8f2;border:1px solid #ebe5d9;border-radius:4px;min-height:94px;padding:11px 12px;text-align:left;color:var(--ink);transition:.15s}.activity:hover:not(:disabled){background:#f7f0e2;border-color:#c5a06b;transform:translateY(-2px)}.activity:disabled{opacity:.42;cursor:not-allowed}.activity .icon{font-size:17px;display:block;margin-bottom:3px}.activity strong{font-size:12px;display:block}.activity small{display:block;color:#858b8e;font-size:10px;margin-top:2px}.stats-panel{padding:21px 22px}.profile{display:flex;align-items:center;gap:13px;padding-bottom:17px;border-bottom:1px solid var(--line)}.avatar{width:46px;height:46px;border-radius:50%;background:#e8dfce;color:#8f603c;display:grid;place-items:center;font:20px Georgia,serif;border:1px solid #d8c8ab}.profile-name{font:500 20px Georgia,serif}.profile-sub{font-size:11px;color:#8b8b85;margin-top:2px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:18px 0 14px}.stat-label{display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#727b81;margin-bottom:5px}.stat-label b{color:#333d45;font-size:11px}.bar{height:4px;background:#eee9df;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:#c4944e;transition:width .5s}.bar.green i{background:#648a72}.bar.red i{background:#c86d5e}.bar.blue i{background:#687fa5}.resources{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resource{background:#f5f1e8;padding:9px 10px;border-radius:3px;font-size:11px;color:#72766e}.resource b{display:block;color:#303a41;font-size:15px;margin-top:1px}.rel-panel,.journal-panel{padding:20px 21px}.rel-list{display:grid;gap:11px;margin-top:14px}.rel{display:flex;align-items:center;gap:9px}.rel-face{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#f0e8da;font-size:12px;color:#856d4b}.rel-info{flex:1;min-width:0}.rel-name{font-size:12px;font-weight:700}.rel-role{font-size:10px;color:#92928c}.rel-meter{width:63px;height:4px;background:#eee8dd;border-radius:5px}.rel-meter i{display:block;height:100%;background:#6e9277;border-radius:5px}.journal-list{display:grid;gap:12px;margin-top:13px}.journal-item{display:flex;gap:10px;color:#757b7b;font-size:11px;line-height:1.45}.journal-item time{min-width:30px;color:#b07e42;font-weight:800}.journal-item span{flex:1}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);background:#17202c;color:#fff;padding:11px 17px;border-radius:4px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:5;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-back{position:fixed;inset:0;background:#101622a8;display:grid;place-items:center;padding:20px;z-index:4}.modal{max-width:450px;width:100%;background:var(--panel);border-radius:7px;padding:28px;box-shadow:0 22px 90px #0004}.modal h2{font:500 26px Georgia,serif;margin:5px 0 10px}.modal p{color:#6e767c;line-height:1.7}.modal-actions{display:flex;gap:9px;margin-top:20px}.secondary{padding:11px 15px;background:transparent;border:1px solid #d9d2c7;color:#59616a;border-radius:4px}.secondary:hover{background:#f5f0e8}.ending{padding:45px 20px;text-align:center}.ending h2{font:500 38px Georgia,serif;margin:8px}.ending p{max-width:520px;color:#737b83;margin:10px auto 22px}.hidden{display:none!important}.year-control{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;border-top:1px solid #ece6db;margin-top:16px}.year-note{font-size:11px;color:#888b87}.finish-year{border:0;background:#253344;color:#fff;padding:10px 15px;border-radius:4px;font-size:12px;font-weight:700}.finish-year:hover{background:#354a60}.mobile-actions{display:none}
.calendar-line{display:flex;flex-direction:column;gap:2px;margin-top:12px;padding:10px 13px;border-left:2px solid var(--gold);background:#fffaf0;max-width:380px}.calendar-line span{font-size:9px;letter-spacing:.15em;font-weight:800;color:#9b7444}.calendar-line strong{font:16px Georgia,serif}.calendar-line small{font-size:10px;color:var(--muted)}.combat-panel{margin-top:14px;padding:16px;border:1px solid #d6b77d;background:#fffaf0;border-radius:5px}.combat-top,.combat-vitals{display:flex;justify-content:space-between;align-items:center;gap:10px}.combat-top{font-family:Georgia,serif;font-size:17px}.combat-vitals{font-size:12px;margin:9px 0}.combat-bar{height:7px;background:#e8e1d5;border-radius:8px;overflow:hidden;flex:1}.combat-bar i{display:block;height:100%;background:var(--red)}.combat-vitals.player .combat-bar i{background:var(--green)}.battle-actions{display:flex;gap:8px;flex-wrap:wrap}.battle-actions button{border:1px solid var(--line);background:#fffdf8;padding:8px 12px;border-radius:4px;color:var(--ink);font-weight:700}.battle-actions button:disabled{opacity:.45;cursor:not-allowed}.rogue-button{width:100%;margin-top:9px}@media(max-width:850px){.layout{grid-template-columns:1fr}.right-column{grid-template-columns:1fr 1fr}.stats-panel{grid-row:span 2}.top-note{display:none}}@media(max-width:600px){.page{padding:25px 14px 42px}.topbar{height:58px;padding:0 15px}.setup{margin:32px auto;padding:27px 21px}.setup h1{font-size:32px}.form-grid{grid-template-columns:1fr}.form-wide{grid-column:auto}.game-header{align-items:flex-start;gap:10px}.game-title{font-size:28px}.year-badge{font-size:10px;padding:7px 9px}.story{padding:23px 20px}.story h2{font-size:23px}.activities{padding:19px 16px}.activity-grid{grid-template-columns:repeat(2,1fr)}.right-column{display:flex;flex-direction:column}.stats-panel{order:-1}.rel-panel,.journal-panel{padding:18px}.year-control{align-items:flex-start;gap:12px}.finish-year{white-space:nowrap}.subtitle{font-size:13px}}

<body><div class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">忍</span><span>SHINOBI · CRÔNICAS DE UMA VIDA</span></div><div class="top-note">Uma vida. Mil caminhos.</div></header><main class="page"><section id="setup" class="setup"></section><section id="game" class="hidden"></section></main></div><div id="toast" class="toast"></div><script>
const clans=['Sem clã','Uzumaki','Uchiha','Hyūga','Nara','Inuzuka','Aburame','Akimichi','Yamanaka','Hōzuki'];
const villages=['Konohagakure','Sunagakure','Kirigakure','Kumogakure','Iwagakure'];
const $=s=>document.querySelector(s); const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const escapeHtml=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let state=null, toastTimer;
function makeSetup(){const saved=localStorage.getItem('shinobi-save');$('#setup').innerHTML=`<div class="eyebrow">Seu destino começa agora</div><h1>Que tipo de shinobi<br>você vai se tornar?</h1><p class="setup-copy">Uma vida inteira no mundo ninja. Faça amigos, treine, aceite missões e escolha o que vale a pena proteger. Cada decisão deixa uma marca.</p><div class="form-grid"><div class="field"><label for="name">Nome</label><input id="name" maxlength="20" placeholder="Ex.: Ren" value="${saved?escapeHtml(JSON.parse(saved).name):''}"></div><div class="field"><label for="clan">Clã / origem</label><select id="clan">${clans.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field form-wide"><label for="village">Vila natal</label><select id="village">${villages.map(v=>`<option>${v}</option>`).join('')}</select></div></div><div class="start-row">${saved?'<button class="primary" id="resume">Continuar jornada&nbsp; →</button>':''}<button class="${saved?'secondary':'primary'}" id="start">${saved?'Nova vida':'Começar minha história'}&nbsp; →</button>${saved?'':'<span class="tiny">A partir dos 6 anos · salvamento automático</span>'}</div>${saved?'<div style="margin-top:16px;color:#64806b;font-size:12px">Sua jornada está salva neste dispositivo.</div>':''}`;
$('#start').onclick=()=>startGame();const resume=$('#resume');if(resume)resume.onclick=()=>{try{state=JSON.parse(localStorage.getItem('shinobi-save'));state.worldYear??=66+(state.age-6);state.health??=100;state.chakraPoints??=40;state.rogue??=false;state.canonSeen??=[];state.combat??=null;save();render()}catch{toast('Não foi possível carregar a jornada salva.')}}; }
makeSetup();
function startGame(){let name=$('#name').value.trim()||'Akira';state={name,clan:$('#clan').value,village:$('#village').value,age:6,worldYear:66,phase:'Estudante',chakra:25,chakraPoints:40,health:100,taijutsu:20,ninjutsu:18,intel:25,bond:20,renown:0,ryo:80,energy:85,activities:0,alive:true,finished:false,rogue:false,canonSeen:[],combat:null,year:0,relations:[{name:'Naruto',role:'colega barulhento',value:25,face:'ナ'},{name:'Sakura',role:'colega de turma',value:20,face:'桜'},{name:'Sasuke',role:'rival talentoso',value:16,face:'う'}],journal:[],eventIndex:0,visited:[]};if(state.clan==='Uchiha')state.ninjutsu+=8;if(state.clan==='Hyūga')state.taijutsu+=8;if(state.clan==='Uzumaki')state.chakra+=10;if(state.clan==='Nara')state.intel+=8;state.event=nextEvent();save();render();}
function save(){if(state)localStorage.setItem('shinobi-save',JSON.stringify(state));}
function addJournal(text){state.journal.unshift({age:state.age,text});state.journal=state.journal.slice(0,8);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
function eventPool(){if(state.age<12)return[
['A primeira prova de coragem','Um gato subiu no telhado da Academia e não consegue descer. Seus colegas olham para você, esperando uma atitude.','Subir e resgatá-lo|+2 taijutsu,+2 bond','Chamar um adulto|+2 intel,+1 bond','Fazer uma aposta com Naruto|+2 renown,-2 bond'],
['O pergaminho esquecido','Na biblioteca, você encontra um pergaminho de exercícios básicos de chakra. O instrutor está ocupado.','Estudar em silêncio|+3 ninjutsu,+2 intel','Levar para o instrutor|+2 bond,+2 renown','Chamar um colega para estudar|+1 intel,+3 bond'],
['Um almoço solitário','Hinata está sentada sozinha no pátio. Naruto tenta equilibrar uma bandeja na cabeça.','Sentar com Hinata|+4 bond,+1 intel','Ajudar Naruto com a bandeja|+3 bond,+1 renown','Treinar no pátio|+2 taijutsu,+2 energy'],
['A rivalidade começa','Sasuke acerta um alvo difícil e todos aplaudem. Você sente a vontade de provar seu valor.','Pedir dicas a ele|+3 bond,+2 intel','Desafiá-lo para uma corrida|+3 taijutsu,+2 renown','Parabenizar e voltar a treinar|+2 bond,+2 ninjutsu'],
['Festival da Vila','Lanternas coloridas tomam as ruas. Você recebeu alguns ryō para gastar como quiser.','Comprar dangos para dividir|-10 ryo,+4 bond','Assistir à demonstração de jutsu|-5 ryo,+3 ninjutsu','Guardar o dinheiro|+15 ryo,+1 intel']];
if(state.age<13)return[
['A graduação se aproxima','A prova da Academia está chegando. O instrutor anuncia um teste de transformação para a turma.','Treinar até acertar|+4 ninjutsu,-8 energy','Estudar fundamentos|+3 intel,+2 chakra','Acalmar um colega nervoso|+3 bond,+1 renown'],
['Trabalho em equipe','Seu time precisa atravessar um campo de obstáculos sem deixar ninguém para trás.','Liderar o grupo|+3 renown,+2 bond','Observar e encontrar uma rota|+4 intel,+1 energy','Ajudar quem ficou para trás|+4 bond,+2 energy'],
['Um dia de treino','Kakashi passa pela Academia e deixa uma dica enigmática sobre concentração.','Praticar controle de chakra|+4 chakra,+2 ninjutsu','Desafiar o boneco de treino|+4 taijutsu,-7 energy','Perguntar sobre trabalho em equipe|+3 intel,+3 bond'],
['O exame final','Você faz o selo da transformação diante dos examinadores. Todos aguardam o resultado.','Respirar e confiar no treino|+3 ninjutsu,+3 renown','Improvisar uma transformação criativa|+3 intel,+4 renown','Pensar no que sua equipe precisa|+4 bond,+2 renown']];
if(state.age<18)return[
['Primeira missão de verdade','Seu time recebe uma missão simples fora da vila. Um contratante parece esconder parte da história.','Investigar antes de agir|+3 intel,+3 renown','Confiar no líder da equipe|+3 bond,+2 energy','Concluir rápido e voltar|+3 taijutsu,+4 ryo'],
['Treino com o time','Seu sensei propõe um exercício de sobrevivência. O objetivo não é vencer: é aprender a cooperar.','Proteger o companheiro|+4 bond,+2 renown','Armar uma estratégia|+4 intel,+1 chakra','Atacar com tudo|+4 taijutsu,-10 energy'],
['Um rumor no mercado','Mercadores falam de ninjas desconhecidos rondando a fronteira. Talvez seja só conversa.','Relatar ao gabinete|+3 renown,+2 bond','Investigar com cuidado|+3 intel,+5 ryo','Ignorar e aproveitar o dia|+8 energy,+2 bond'],
['O caminho do ninja','Um colega pergunta o que você espera da vida shinobi. Sua resposta surpreende até você.','Ser forte o bastante para proteger|+3 bond,+3 taijutsu','Descobrir todos os jutsus possíveis|+3 chakra,+3 ninjutsu','Escolher seu próprio caminho|+3 intel,+3 renown']];
return[
['Uma missão de alto risco',`O gabinete oferece uma missão rank ${state.age>25?'A':'B'} além das fronteiras. A equipe está contando com você.`,'Aceitar e liderar|+5 renown,+4 ryo,-12 energy','Planejar cada detalhe|+4 intel,+2 renown','Pedir reforços para o time|+4 bond,+2 renown'],
['Um velho rival','Você reencontra Sasuke numa estrada distante. Há muito a dizer, mas o silêncio pesa.','Conversar sem levantar a guarda|+5 bond,+2 intel','Propor um duelo amistoso|+4 taijutsu,+3 renown,-8 energy','Seguir viagem em paz|+3 intel,+4 energy'],
['Convite para ensinar','A Academia precisa de alguém para orientar a nova geração. Você se lembra de como tudo começou.','Aceitar como sensei|+5 bond,+5 renown,-5 ryo','Dar uma aula especial|+4 intel,+3 renown','Ainda não é a hora|+5 energy,+3 ryo'],
['Escolhas de um líder','Uma decisão difícil divide a vila. A solução mais fácil pode custar a confiança de alguém.','Ouvir todas as partes|+4 bond,+4 intel','Decidir pelo bem maior|+5 renown,+3 bond','Adiar e buscar outra saída|+3 intel,-2 renown'],
['Paz também é uma missão','Por um tempo, não há alarmes nem chamados urgentes. O que fazer com esse raro silêncio?','Visitar quem você ama|+5 bond,-8 ryo','Pesquisar uma técnica nova|+4 ninjutsu,+2 chakra,-6 ryo','Descansar sem culpa|+15 energy,+2 bond']];}
function canonEvent(){if(state.canonSeen.includes(state.worldYear))return null;const year=state.worldYear;if(year===68){const uchiha=state.clan==='Uchiha'&&state.village==='Konohagakure';return{title:'A noite do massacre Uchiha',canonYear:year,text:uchiha?'A tragédia que atinge o clã Uchiha toma as ruas da Folha. Em meio ao caos, você precisa decidir como sobreviver; os acontecimentos centrais da história seguem seu curso.':'A notícia da tragédia do clã Uchiha se espalha pela Folha. A vila está em choque, e todos tentam entender o que acontecerá com os sobreviventes.',choices:uchiha?[{label:'Fugir da Folha com ajuda de um aliado',effect:'+4 intel,-4 bond',action:'rogue'},{label:'Procurar abrigo e proteger um sobrevivente',effect:'+4 bond,+2 renown'},{label:'Manter-se escondido até a vila se acalmar',effect:'+3 intel,+2 chakra'}]:[{label:'Acolher quem precisa de ajuda',effect:'+4 bond,+2 renown'},{label:'Ouvir os rumores sem se envolver',effect:'+3 intel,+2 energy'},{label:'Ajudar a vila a manter a calma',effect:'+3 bond,+2 renown'}]};}const moments={70:{title:'A invasão durante o Exame Chūnin',text:'Durante o exame, uma aliança inimiga ataca a Folha. O período de provas vira uma luta para proteger moradores e companheiros.',choices:[{label:'Ajudar a evacuar a área',effect:'+4 bond,+2 renown'},{label:'Observar e levar informações ao comando',effect:'+4 intel,+2 renown'},{label:'Ficar ao lado da equipe',effect:'+3 taijutsu,+3 bond'}]},72:{title:'A partida de Sasuke',text:'Sasuke deixa a vila em busca de poder. Amigos e líderes discutem como trazê-lo de volta sem esquecer os riscos.',choices:[{label:'Apoiar a equipe de resgate',effect:'+3 taijutsu,+3 bond'},{label:'Ajudar a planejar a busca',effect:'+4 intel,+2 renown'},{label:'Respeitar a escolha dele, mesmo discordando',effect:'+4 bond,+2 intel'}]},76:{title:'O ataque de Pain',text:'A Folha é atingida por uma força devastadora. A prioridade é salvar vidas e ajudar a vila a se reerguer.',choices:[{label:'Resgatar moradores',effect:'+5 bond,+3 renown,-8 energy'},{label:'Levar suprimentos aos feridos',effect:'+4 renown,+2 intel'},{label:'Defender um ponto de evacuação',effect:'+3 taijutsu,+3 renown,-8 energy'}]},78:{title:'A Quarta Guerra Shinobi',text:'As grandes vilas se unem diante de uma ameaça comum. Sua experiência pode fazer diferença na proteção da aliança.',choices:[{label:'Lutar ao lado da aliança',effect:'+4 taijutsu,+4 renown,-10 energy'},{label:'Coordenar informações e estratégia',effect:'+5 intel,+3 renown'},{label:'Proteger aliados e civis',effect:'+5 bond,+3 renown'}]}};const moment=moments[year];return moment?{...moment,canonYear:year}:null;}function nextEvent(){const canon=canonEvent();if(canon)return canon;const pool=eventPool();let idx=Math.floor(Math.random()*pool.length);if(pool.length>1&&idx===state.eventIndex)idx=(idx+1)%pool.length;state.eventIndex=idx;const e=pool[idx];return{title:e[0],text:e[1],choices:e.slice(2).map(s=>{const [label,effect]=s.split('|');return{label,effect}})};}
const actions=[
{icon:'◈',title:'Treinar',hint:'Aprimore uma habilidade',run(){const skills=['taijutsu','ninjutsu','chakra'];const sk=skills[Math.floor(Math.random()*skills.length)];state[sk]+=5;state.energy-=14;return `Treino intenso: +5 ${skillLabel(sk)}.`}},
{icon:'⌕',title:'Estudar',hint:'Conhecimento e estratégia',run(){state.intel+=5;state.energy-=7;return'Você estudou táticas e teoria ninja. +5 inteligência.'}},
{icon:'♡',title:'Conviver',hint:'Fortaleça uma amizade',run(){let r=state.relations[Math.floor(Math.random()*state.relations.length)];r.value=clamp(r.value+9);state.bond+=3;state.energy-=4;return`Um bom momento com ${r.name}. +9 amizade.`}},
{icon:'⚑',title:'Fazer missão',hint:state.rogue?'Aceite um trabalho clandestino':'Ganhe ryō e reputação',run(){if(state.age<12)return null;let success=state.intel+state.taijutsu+state.ninjutsu+state.chakra>150;state.ryo+=state.rogue?(success?35:18):(success?28:12);state.renown+=success?5:2;state.energy-=22;return state.rogue?(success?'Trabalho clandestino concluído. +35 ryō; sua fama entre nukenin cresce.':'O trabalho clandestino foi difícil. +18 ryō e você escapou.'):(success?'Missão concluída com mérito. +28 ryō, +5 reputação.':'A missão foi complicada, mas voltou em segurança. +12 ryō, +2 reputação.')}},
{icon:'⌂',title:'Descansar',hint:'Recupere energia',run(){state.energy=clamp(state.energy+27);state.bond+=1;return'Um dia tranquilo devolveu suas forças. +27 energia.'}},
{icon:'◉',title:'Explorar',hint:'Descubra algo inesperado',run(){const finds=['Você ouviu histórias de viajantes. +2 inteligência.','Um comerciante pagou por sua ajuda. +18 ryō.','Encontrou um lugar calmo para meditar. +4 chakra.','Ajudou um morador e ganhou sua confiança. +3 reputação.'];let n=Math.floor(Math.random()*finds.length);if(n===0)state.intel+=2;if(n===1)state.ryo+=18;if(n===2)state.chakra+=4;if(n===3)state.renown+=3;state.energy-=5;return finds[n]}},
 {icon:'⚔',title:'Combater',hint:'Treine em um duelo por turnos',run(){return startCombat()}}
];
function startCombat(){const names=state.rogue?['Caçador de recompensas','Ninja rastreador','Mercenário da fronteira']:['Rival da Academia','Ninja renegado','Desafiante da vila'];const name=names[Math.floor(Math.random()*names.length)];const max=48+Math.min(38,Math.floor(state.age*.65));state.combat={name,health:max,maxHealth:max,power:9+Math.floor(state.age/5),guard:false};state.energy-=8;return`Você iniciou um duelo contra ${name}. Escolha seus movimentos.`;}function combatTurn(move){const b=state.combat;if(!b)return;let text='';if(move==='fugir'){state.health=Math.max(1,state.health-3);state.combat=null;text='Você encerrou o duelo e recuou. -3 vitalidade.';}else{if(move==='atacar'){const damage=9+Math.floor(state.taijutsu*.24)+Math.floor(Math.random()*7);b.health=Math.max(0,b.health-damage);text=`Seu ataque acerta e causa ${damage} de dano.`;}else if(move==='jutsu'){if(state.chakraPoints<12){toast('Você precisa de 12 pontos de chakra para usar um jutsu.');return}state.chakraPoints-=12;const damage=12+Math.floor(state.ninjutsu*.3)+Math.floor(Math.random()*9);b.health=Math.max(0,b.health-damage);text=`Seu jutsu acerta e causa ${damage} de dano. -12 chakra.`;}else{state.chakraPoints=clamp(state.chakraPoints+9);b.guard=true;text='Você assume uma postura defensiva e recupera 9 chakra.';}if(b.health<=0){state.combat=null;state.ryo+=16;state.renown+=3;state.taijutsu+=1;state.energy=clamp(state.energy-4);text+=` Vitória! +16 ryō, +3 reputação e +1 taijutsu.`;}else{let damage=Math.max(3,b.power+Math.floor(Math.random()*7)-Math.floor(state.taijutsu*.09));if(b.guard)damage=Math.ceil(damage*.35);state.health=Math.max(0,state.health-damage);b.guard=false;text+=` ${b.name} contra-ataca e causa ${damage} de dano.`;if(state.health<=0){state.health=12;state.combat=null;state.energy=clamp(state.energy-12);text+=' Você foi derrotado e recuou com ajuda da equipe. Vitalidade recuperada até 12.';}}}addJournal(text);save();render();toast(text);}function setRogue(){if(state.rogue)return;state.rogue=true;state.bond=clamp(state.bond-8);state.renown+=2;addJournal(`Você abandonou ${state.village} e passou a viver como ninja rogue (nukenin).`);save();}function becomeRogue(){if(state.rogue)return;if(confirm(`Abandonar ${state.village} e se tornar um ninja rogue (nukenin)? Essa escolha muda suas missões e sua vida na vila.`)){setRogue();render();toast('Você agora é um nukenin. Sua antiga vila pode enviar perseguidores.');}}function doAction(i){if(state.combat){toast('Conclua o combate atual antes de fazer outra atividade.');return}if(state.finished||state.activities>=2||(state.energy<5&&i!==4)){ toast(state.activities>=2?'Você já aproveitou suas duas atividades deste ano.':'Energia baixa — tente descansar.');return}const result=actions[i].run();if(!result){toast('Missões ninja ficam disponíveis a partir dos 12 anos.');return}state.activities++;state.energy=clamp(state.energy);state.ryo=Math.max(0,state.ryo);addJournal(result);save();render();toast(result)}
function applyEffect(effect){for(const part of effect.split(',')){const m=part.match(/^([+-])(\d+)\s+(\w+)$/);if(!m)continue;const amount=Number(m[2])*(m[1]==='-'?-1:1),key=m[3];if(key==='ryo')state.ryo=Math.max(0,state.ryo+amount);else if(key==='energy')state.energy=clamp(state.energy+amount);else if(key==='bond'){state.bond=clamp(state.bond+amount);if(state.relations.length)state.relations[0].value=clamp(state.relations[0].value+Math.ceil(amount/2))}else state[key]=clamp((state[key]||0)+amount)} }
function choose(i){if(state.combat){toast('Conclua ou encerre o duelo antes de avançar o ano.');return}const c=state.event.choices[i];applyEffect(c.effect);if(c.action==='rogue')setRogue();if(state.event.canonYear)state.canonSeen.push(state.event.canonYear);addJournal(`${state.event.title}: ${c.label}.`);state.activities=0;state.age++;state.worldYear++;if(state.age===13)state.phase='Genin';if(state.age===16)state.phase='Chūnin';if(state.age===20)state.phase='Jōnin';if(state.age===65)state.phase='Ancião';if(state.age>=85){state.finished=true;state.phase='Lenda';}state.energy=clamp(state.energy+8);state.health=clamp(state.health+20);state.chakraPoints=clamp(state.chakraPoints+15);state.event=state.finished?null:nextEvent();save();render();}
function skillLabel(key){return{taijutsu:'taijutsu',ninjutsu:'ninjutsu',chakra:'chakra'}[key]||key}
function stat(label,key,color=''){let value=clamp(state[key]);return `<div class="stat"><div class="stat-label"><span>${label}</span><b>${value}</b></div><div class="bar ${color}"><i style="width:${value}%"></i></div></div>`}
function render(){if(!state)return;$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');const initials=state.name.slice(0,1).toUpperCase();const stage=state.age<12?'Academia Ninja':state.age<18?'Equipe Genin':state.age<30?'Shinobi de carreira':state.age<60?'Veterano':'Legado ninja';
if(state.finished){$('#game').innerHTML=`<div class="panel ending"><div class="eyebrow">Fim de uma jornada extraordinária</div><h2>${state.name}, uma vida lembrada</h2><p>Aos ${state.age} anos, você deixa um legado de ${state.renown} pontos de reputação. As histórias de seus feitos continuarão inspirando a próxima geração.</p><button class="primary" onclick="newLife()">Começar outra vida&nbsp; →</button></div>`;return}
$('#game').innerHTML=`<div class="game-header"><div><div class="eyebrow">${state.village} · ${state.clan}</div><h1 class="game-title">A vida de ${state.name}</h1><p class="subtitle">${stage} · ${state.phase}</p></div><div><div class="year-badge">Ano ${state.age-5} da jornada</div><div class="calendar-line"><span>CALENDÁRIO DO MUNDO NINJA</span><strong>Ano ${state.worldYear} · ${state.age} anos</strong><small>Data fictícia da linha do tempo de Naruto</small></div></div></div><div class="layout"><div class="left-column"><article class="panel story"><div class="story-top"><span class="story-tag">Capítulo ${state.age-5} · ${state.age} anos</span><span class="tiny">${state.phase}</span></div><h2>${state.event.title}</h2><p>${state.event.text}</p><div class="choices">${state.event.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><span>${c.label}</span><span class="arrow">→</span></button>`).join('')}</div><footer>Uma escolha por ano · As consequências moldam sua história</footer></article>
<div class="panel activities"><div class="section-head"><h3 class="section-title">O que você faz este ano?</h3><span class="counter">${state.activities}/2 atividades</span></div><div class="activity-grid">${actions.map((a,i)=>`<button class="activity" onclick="doAction(${i})" ${state.activities>=2||(state.energy<5&&i!==4)?'disabled':''}><span class="icon">${a.icon}</span><strong>${a.title}</strong><small>${a.title==='Fazer missão'&&state.age<12?'Desbloqueia aos 12 anos':a.hint}</small></button>`).join('')}</div>${state.combat?`<div class="combat-panel"><div class="combat-top"><span>Duelo: ${escapeHtml(state.combat.name)}</span><span>${state.combat.health} / ${state.combat.maxHealth} PV</span></div><div class="combat-vitals"><span>Oponente</span><div class="combat-bar"><i style="width:${Math.max(0,state.combat.health/state.combat.maxHealth*100)}%"></i></div></div><div class="combat-vitals player"><span>${escapeHtml(state.name)}</span><div class="combat-bar"><i style="width:${state.health}%"></i></div><b>${state.health} PV</b><span>◉ ${state.chakraPoints} chakra</span></div><div class="battle-actions"><button onclick="combatTurn('atacar')">Atacar</button><button onclick="combatTurn('jutsu')" ${state.chakraPoints<12?'disabled':''}>Usar jutsu · 12 chakra</button><button onclick="combatTurn('defender')">Defender / concentrar</button><button onclick="combatTurn('fugir')">Fugir</button></div></div>`:''}<div class="year-control"><span class="year-note">Sua escolha no capítulo acima encerra o ano e avança a história.</span><span class="counter">♡ energia ${state.energy}%</span></div></div>
<div class="panel journal-panel"><div class="section-head"><h3 class="section-title">Memórias recentes</h3><span class="counter">Diário</span></div><div class="journal-list">${state.journal.length?state.journal.slice(0,4).map(j=>`<div class="journal-item"><time>${j.age}a</time><span>${j.text}</span></div>`).join(''):'<div class="tiny">Suas escolhas importantes aparecerão aqui.</div>'}</div></div></div>
<aside class="right-column"><div class="panel stats-panel"><div class="profile"><div class="avatar">${initials}</div><div><div class="profile-name">${state.name}</div><div class="profile-sub">${state.clan} · ${state.phase}</div></div></div><div class="stats-grid">${stat('Chakra','chakra','blue')}${stat('Taijutsu','taijutsu','red')}${stat('Ninjutsu','ninjutsu','blue')}${stat('Inteligência','intel')}${stat('Vínculos','bond','green')}${stat('Reputação','renown','green')}</div><div class="resources"><div class="resource">Energia<b>${state.energy} / 100</b></div><div class="resource">Ryō<b>¥ ${state.ryo}</b></div><div class="resource">Vitalidade<b>${state.health} / 100</b></div><div class="resource">Chakra de combate<b>${state.chakraPoints} / 100</b></div></div><button class="secondary rogue-button" onclick="becomeRogue()" ${state.rogue?'disabled':''}>${state.rogue?'✓ Ninja rogue · Nukenin':'Abandonar a vila e tornar-se ninja rogue'}</button></div>
<div class="panel rel-panel"><div class="section-head"><h3 class="section-title">Seu círculo</h3><span class="counter">Laços</span></div><div class="rel-list">${state.relations.map(r=>`<div class="rel"><div class="rel-face">${r.face}</div><div class="rel-info"><div class="rel-name">${r.name}</div><div class="rel-role">${r.role}</div></div><div class="rel-meter"><i style="width:${r.value}%"></i></div></div>`).join('')}</div></div><div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px"><span class="tiny">Progresso salvo automaticamente</span><button class="secondary" style="padding:7px 10px;font-size:11px" onclick="confirmRestart()">Nova vida</button></div></aside></div>`;state.year=state.age-6;}
function skipActivities(){toast('Você segue para o próximo capítulo. Escolha um caminho!')}
function newLife(){localStorage.removeItem('shinobi-save');state=null;$('#game').classList.add('hidden');$('#setup').classList.remove('hidden');makeSetup();window.scrollTo(0,0)}
function confirmRestart(){if(confirm('Começar uma nova vida? Seu progresso atual será substituído.'))newLife()}
</script></body></html>
